<!DOCTYPE html>
<!--
  LONA Island page (v1.6.4 reskin).
  Island method adapted from WindyLand (MIT, Copyright (c) 2026 Shabab)
  - method and interaction ideas only; no WindyLand code, palette,
  icons, or assets used. Full license text: THIRD_PARTY.md (repo root).

  Fixed canvas (WindyLand method): the window is created once at
  520x300 and NEVER resized. Collapsed <-> expanded animates purely
  in CSS inside that canvas (pill 220x60 <-> rounded pill 520x300);
  the area outside the pill is transparent HTML. The Python side only
  toggles WS_EX_TRANSPARENT (island_resize is a state shim now) - no
  window resize, no region re-application, no race.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LONA Island</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/lona.css">
<style>
  /* --- fixed canvas: the window is 520x300, always. The pill and the
     panel are drawn inside it; nothing here resizes the window. --- */
  body.fixed-canvas .island{width:220px;height:60px}
  body.fixed-canvas .island.open{width:520px;height:300px;border-radius:44px}
  /* --- expanded pill fits the 520x300 canvas: the small-screen media
     query in lona.css would hide the stand below 640px, so the island
     re-asserts its own two-column layout + tighter paddings here. --- */
  body.fixed-canvas .island.open .i-full{grid-template-columns:170px 1fr}
  body.fixed-canvas .island.open .stand{display:flex}
  body.fixed-canvas .island.open .chat-side{padding:16px 18px;gap:10px}
  body.fixed-canvas .island.open .chat-side h2{font-size:20px}
  body.fixed-canvas .island.open .i-reply{max-height:72px}
  body.fixed-canvas .i-toast{max-width:480px}
  /* --- toast: brief alert expansion, overlaid on the canvas --- */
  .i-toast{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:50;
    max-width:640px;padding:10px 18px;border-radius:16px;text-align:center;
    background:rgba(11,20,48,.85);color:var(--ink);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(0,0,0,.35);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    pointer-events:none;font-size:13px;line-height:1.7}
  .i-toast b{display:block;font-size:13.5px;color:var(--gold-2)}
  /* --- mic/camera in-use dots (hidden until the backend says they exist) --- */
  .mdots{display:flex;align-items:center;gap:5px}
  .mdot{width:8px;height:8px;border-radius:50%;background:#ff5f57;box-shadow:0 0 6px #ff5f57}
  .mdot.mic{background:#ff9f0a;box-shadow:0 0 6px #ff9f0a}
  /* --- panels button (expanded view only) --- */
  .panels-btn{position:absolute;top:10px;inset-inline-end:10px;z-index:4;display:none}
  .island.open .panels-btn{display:grid}
  /* --- feature panels overlay --- */
  .i-panels{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;
    background:rgba(11,20,48,.88);border-radius:inherit;overflow:hidden;
    -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
  .island.panels .i-panels{display:flex}
  .p-tabs{display:flex;align-items:center;gap:6px;padding:12px 12px 8px;
    overflow-x:auto;flex:none;scrollbar-width:none}
  .p-tabs::-webkit-scrollbar{display:none}
  .p-tab{flex:none;border:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
    padding:7px 12px;border-radius:99px;cursor:pointer;background:rgba(255,255,255,.1)}
  .p-tab.sel{background:linear-gradient(160deg,var(--gold-2),var(--gold));color:#4a3300}
  .p-close{flex:none;margin-inline-start:auto}
  .p-body{flex:1;min-height:0;overflow-y:auto;padding:6px 18px 18px;font-size:13.5px;line-height:1.8}
  .p-body h3{font-size:15px;margin:6px 0 10px}
  .p-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .p-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;
    background:rgba(255,255,255,.08);margin-bottom:8px}
  .p-item .grow{flex:1;min-width:0}
  .p-item .sub{font-size:11.5px;color:var(--ink-2);line-height:1.5;word-break:break-word}
  .p-btn{border:0;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink);
    padding:7px 13px;border-radius:99px;cursor:pointer;background:rgba(255,255,255,.14)}
  .p-btn.gold{background:linear-gradient(160deg,var(--gold-2),var(--gold));color:#4a3300}
  .p-btn:disabled{opacity:.45;cursor:default}
  .p-input{flex:1;min-width:0;background:rgba(10,16,44,.35);border:0;outline:0;color:var(--ink);
    font:inherit;font-size:13.5px;padding:9px 12px;border-radius:14px}
  .p-input::placeholder{color:var(--ink-3)}
  .p-note{font-size:12px;color:var(--ink-2);margin:8px 0}
  .p-big{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;
    text-align:center;margin:10px 0 4px;letter-spacing:.02em}
  .p-center{text-align:center}
  .p-lyric{padding:3px 8px;border-radius:8px;color:var(--ink-2)}
  .p-lyric.cur{color:var(--gold-2);font-weight:600;background:rgba(240,199,94,.12)}
  .p-prog{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin:8px 0}
  .p-prog i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--gold-2),var(--gold))}
  .p-time{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2)}
  .p-time b{color:var(--gold-2)}
  .done-x{text-decoration:line-through;opacity:.55}
</style>
</head>
<body class="island-page fixed-canvas">
<div class="errbar" id="errbar" hidden><span id="errbarText"></span><button id="errbarClose" type="button">إخفاء</button></div>
<div class="i-toast" id="islandToast" hidden><b id="toastTitle"></b><span id="toastBody"></span></div>

<section class="glass island" id="island" aria-label="لونا">
  <div class="ib" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="i-mini" id="mini">
    <div class="bubble mascot-face" data-stop><img src="assets/mascot.webp" alt="لونا"></div>
    <div><div class="i-title" id="pillName">لونا</div><div class="i-status"><span class="dot"></span></div></div>
    <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <span class="mdots" id="mediaDots" hidden>
      <i class="mdot mic" title="المايك شغال"></i><i class="mdot cam" title="الكاميرا شغالة"></i>
    </span>
  </div>
  <div class="i-full">
    <div class="stand"><div class="platform"></div><div class="mascot-face" data-stop><img src="assets/mascot.webp" alt="لونا"></div></div>
    <div class="chat-side">
      <h2 id="greet">أهلًا، أقدر أساعدك في إيه؟</h2>
      <p class="mood" id="moodLine" style="font-size:13px;color:var(--ink-2)"></p>
      <div class="i-reply" id="replyBox"></div>
      <div class="field">
        <button class="round" id="attachBtn" aria-label="إرفاق" data-stop>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input id="islInput" placeholder="اكتب هنا" data-stop autocomplete="off" virtualkeyboardpolicy="manual">
        <button class="round gold" id="islSend" aria-label="إرسال" data-stop>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
  <button class="round panels-btn" id="panelsBtn" aria-label="لوحات الجزيرة" data-stop>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
  </button>
  <div class="i-panels" id="panels" data-stop>
    <div class="p-tabs" id="panelTabs"></div>
    <div class="p-body" id="panelBody"></div>
  </div>
</section>

<script src="assets/bridge.js"></script>
<script>
(function () {
  'use strict';
  var B = window.LonaBridge;
  var isl = document.getElementById('island');
  var input = document.getElementById('islInput');
  var replyBox = document.getElementById('replyBox');
  var moodLine = document.getElementById('moodLine');
  var toast = document.getElementById('islandToast');
  var toastTitle = document.getElementById('toastTitle');
  var toastBody = document.getElementById('toastBody');
  var panelsEl = document.getElementById('panels');
  var panelTabs = document.getElementById('panelTabs');
  var panelBody = document.getElementById('panelBody');
  var busy = false;
  var toastTimer = null;
  var toastOpened = false;
  var userName = '';
  var panelTimer = null;
  var currentPanel = null;
  var lastWaterNudge = 0;
  /* v1.6.4 perf (c): NO timers run while the island is collapsed.
     moodTimer (5 s mood poll) + reminderTimer (60 s due-task/water
     check) start on expand and are cleared on collapse. The only
     thing alive while collapsed is the native 90 ms cursor poll
     (Python side). panelTimer (1 s music/timer refresh) is also
     cleared on collapse (see setOpen). */
  var moodTimer = null;
  var reminderTimer = null;
  var moodInFlight = false;
  var reminderInFlight = false;

  document.getElementById('errbarClose').addEventListener('click', function () {
    B.hideError();
  });

  function fail(source, err) { B.reportFailure(source, err); }
  function esc(s) { return B.escapeHtml(s == null ? '' : String(s)); }
  function isOpen() { return isl.classList.contains('open'); }

  /* --- expand / collapse: click anywhere on the island except buttons ---
     Fixed canvas: the WINDOW never resizes. island_expand / island_collapse
     only flip the Python-side state (WS_EX_TRANSPARENT); the visual
     animation is the .open class in this fixed 520x300 canvas. */
  function setOpen(opening, focusInput) {
    isl.classList.toggle('open', opening);
    if (!opening) {
      /* Collapsing kills every JS timer at once: the mood poll, the
         reminder check, and the 1 s panel refresh (a music panel left
         open must not keep calling island_music every second while
         collapsed). The panels overlay itself stays in the DOM and
         re-opens with the island. */
      stopExpandedTimers();
      stopPanelRefresh();
    }
    var w = opening ? 520 : 220;
    var h = opening ? 300 : 60;
    return B.call(opening ? 'island_expand' : 'island_collapse').then(function () {
      return B.call('island_resize', w, h);
    }).then(function () {
      if (opening) {
        startExpandedTimers();
        refreshMusicState();
        if (focusInput) { input.focus(); }
      }
    }).catch(function (err) {
      /* The bridge call failed and the caller reverts the .open
         class - re-sync the timers to the class that actually ends
         up showing, so a failed collapse never leaves the island
         visually open with dead timers (or vice versa). */
      if (isOpen()) { startExpandedTimers(); }
      else { stopExpandedTimers(); stopPanelRefresh(); }
      throw err;
    });
  }

  /* --- expanded-only timers (v1.6.4 perf (c)): start on expand,
     clear on collapse. pollMood runs once immediately so the mood
     line is fresh on open, then every 5 s; checkReminders runs
     every 60 s. Both carry in-flight guards. --- */
  function startExpandedTimers() {
    if (!moodTimer) {
      pollMood();
      moodTimer = setInterval(pollMood, 5000);
    }
    if (!reminderTimer) {
      reminderTimer = setInterval(checkReminders, 60000);
    }
  }

  function stopExpandedTimers() {
    if (moodTimer) { clearInterval(moodTimer); moodTimer = null; }
    if (reminderTimer) { clearInterval(reminderTimer); reminderTimer = null; }
  }

  isl.addEventListener('click', function (e) {
    if (e.target.closest('[data-stop]')) { return; }
    var opening = !isOpen();
    setOpen(opening, true).catch(function (err) {
      isl.classList.toggle('open', !opening);
      fail('island_resize', err);
    });
  });

  /* --- hover-open: the passthrough loop calls this when the cursor is
     over the pill while the window is click-through. --- */
  window.openIslandFromHover = function () {
    if (isOpen()) { return; }
    setOpen(true, false).catch(function (err) { fail('island_hover_open', err); });
  };

  /* --- toast: brief island expansion for alerts (volume / battery /
     Caps Lock / monitor alerts). Python calls this via evaluate_js;
     it opens the island if collapsed and collapses again after a
     few seconds — unless the user has clicked into the island. --- */
  window.showIslandToast = function (title, body, autoMs) {
    toastTitle.textContent = title || 'لونا';
    toastBody.textContent = body || '';
    toast.hidden = false;
    if (toastTimer) { clearTimeout(toastTimer); toastTimer = null; }
    if (!isOpen()) {
      toastOpened = true;
      setOpen(true, false).catch(function (err) { fail('island_toast_open', err); });
    }
    var ms = autoMs || 6000;
    toastTimer = setTimeout(function () {
      toast.hidden = true;
      toastTimer = null;
      if (toastOpened && isOpen() && !isl.classList.contains('panels')) {
        toastOpened = false;
        setOpen(false, false).catch(function (err) { fail('island_toast_close', err); });
      }
      toastOpened = false;
    }, ms);
  };

  /* --- interactive face: tapping the robot face (pill or expanded
     stand) bounces it and shows a short greeting in the reply area.
     The faces carry data-stop, so this never toggles expand/collapse;
     from the collapsed pill it opens the island to show the greeting. --- */
  function greetFromFace(face) {
    face.classList.remove('bounce');
    void face.offsetWidth;
    face.classList.add('bounce');
    replyBox.textContent = 'أهلاً ' + (userName || 'Mohamed') + '!';
    if (!isOpen()) {
      setOpen(true, false).catch(function (err) { fail('island_face_open', err); });
    }
  }
  document.querySelectorAll('#island .mascot-face').forEach(function (face) {
    face.addEventListener('click', function () { greetFromFace(face); });
  });

  /* --- attach: not wired in the v2 bridge — say so honestly, fake nothing --- */
  document.getElementById('attachBtn').addEventListener('click', function () {
    replyBox.textContent = 'إرفاق الملفات من الجزيرة لسه مش متاح في النسخة دي — استخدم النافذة الرئيسية.';
  });

  function sendChat() {
    var text = input.value.trim();
    if (!text || busy) { return; }
    busy = true;
    input.value = '';
    replyBox.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    B.call('chat', text, {}).then(function (res) {
      res = res || {};
      if (res.pending && (res.id || res.chat_id)) {
        var id = res.id || res.chat_id;
        return B.pollUntil(id, function (cid) { return B.call('chat_result', cid); }, 120000, 800);
      }
      return { done: true, reply: res.reply || res.text || res.message || '' };
    }).then(function (res) {
      var txt = (res && (res.reply || res.text || res.message)) || '';
      replyBox.textContent = txt || 'مفيش رد وصل — جرّب تاني.';
    }).catch(function (err) {
      replyBox.textContent = '';
      fail('island_chat', err);
    }).then(function () { busy = false; });
  }
  document.getElementById('islSend').addEventListener('click', sendChat);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { sendChat(); }
  });

  /* --- greeting name + mood (bridge only, no invented values) ---
     window.setMood is the hook v1's Python calls (chat_result, via
     evaluate_js) to restore the robot's mood the moment a reply lands.
     The 5s poll below would do the same; this just skips the wait. */
  window.setMood = function (name) {
    if (name) { moodLine.textContent = name; }
  };

  /* v1.3.2 bridge-ready watchdog: log READY so the log proves the
     island page's bridge came up. */
  B.call('log_js', 'READY island').catch(function () {});

  B.call('get_settings').then(function (s) {
    s = s || {};
    /* Pill title is the LIVE assistant name (ai_name, default لونا),
       never a static label — renaming in Settings updates it here. */
    var aiName = s.ai_name || s.name || 'لونا';
    var pill = document.getElementById('pillName');
    if (pill) { pill.textContent = aiName; }
    document.getElementById('island').setAttribute('aria-label', aiName);
    var name = s.user_name || s.user || '';
    userName = name;
    if (name) {
      document.getElementById('greet').textContent = 'أهلًا ' + name + '، أقدر أساعدك في إيه؟';
    }
  }).catch(function (err) { fail('island_settings', err); });

  function pollMood() {
    if (moodInFlight) { return; }
    moodInFlight = true;
    B.call('get_mood').then(function (m) {
      m = m || {};
      var line = m.reason || m.mood || '';
      if (line) { moodLine.textContent = line; }
    }).catch(function (err) { fail('island_mood', err); })
    .then(function () { moodInFlight = false; });
  }
  /* No mood poll at load: the island starts collapsed, and nothing
     polls while collapsed (v1.6.4 perf (c)). The first poll happens
     on the first expand (startExpandedTimers). */

  /* --- mic/camera dots: only shown when the backend says they exist.
     There is no public Windows API for this (see island_features.py),
     so they stay hidden rather than faked. --- */
  B.call('island_media_indicators').then(function (r) {
    r = r || {};
    if (r.available) {
      var dots = document.getElementById('mediaDots');
      dots.hidden = false;
      dots.querySelector('.mic').style.display = r.mic_in_use ? '' : 'none';
      dots.querySelector('.cam').style.display = r.camera_in_use ? '' : 'none';
    }
  }).catch(function () { /* unavailable — dots stay hidden */ });

  /* ================= feature panels ================= */
  var PANELS = [
    { id: 'music', label: 'موسيقى' },
    { id: 'timer', label: 'مؤقت' },
    { id: 'tasks', label: 'مهام' },
    { id: 'clipboard', label: 'الحافظة' },
    { id: 'shelf', label: 'ملفات' },
    { id: 'water', label: 'مياه' },
    { id: 'prayer', label: 'صلاة' },
    { id: 'notifs', label: 'إشعارات' }
  ];
  var prayerMethod = 'egypt';

  function fmtClock(totalSec) {
    totalSec = Math.max(0, Math.round(totalSec || 0));
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function stopPanelRefresh() {
    if (panelTimer) { clearInterval(panelTimer); panelTimer = null; }
  }

  function openPanel(id) {
    currentPanel = id;
    isl.classList.add('panels');
    panelTabs.innerHTML = PANELS.map(function (p) {
      return '<button class="p-tab' + (p.id === id ? ' sel' : '') + '" data-panel="' + p.id + '">' + esc(p.label) + '</button>';
    }).join('') + '<button class="p-btn p-close" id="panelClose">إغلاق</button>';
    document.getElementById('panelClose').addEventListener('click', closePanels);
    panelTabs.querySelectorAll('[data-panel]').forEach(function (btn) {
      btn.addEventListener('click', function () { openPanel(btn.getAttribute('data-panel')); });
    });
    stopPanelRefresh();
    renderPanel(id);
    if (id === 'music' || id === 'timer') {
      panelTimer = setInterval(function () { renderPanel(id); }, 1000);
    }
  }

  function closePanels() {
    currentPanel = null;
    stopPanelRefresh();
    isl.classList.remove('panels');
  }

  document.getElementById('panelsBtn').addEventListener('click', function () {
    if (isl.classList.contains('panels')) { closePanels(); return; }
    openPanel('music');
  });

  function renderPanel(id) {
    if (id === 'music') { renderMusic(); }
    else if (id === 'timer') { renderTimer(); }
    else if (id === 'tasks') { renderTasks(); }
    else if (id === 'clipboard') { renderClipboard(); }
    else if (id === 'shelf') { renderShelf(); }
    else if (id === 'water') { renderWater(); }
    else if (id === 'prayer') { renderPrayer(); }
    else if (id === 'notifs') { renderNotifs(); }
  }

  /* v1.6.4 perf (a): island_music / island_lyrics / island_notifi-
     cations run OFF the bridge thread - they return {pending, id}
     at once and the result is polled here via job_result, exactly
     like chat / test_api_key. A direct await would freeze the whole
     app for up to 5 s (SMTC) / 8 s (LRCLIB) per call. */
  function fetchIslandJob(method, args, timeoutMs) {
    return B.call.apply(B, [method].concat(args || [])).then(function (res) {
      res = res || {};
      if (res.pending && res.id) {
        return B.pollUntil(res.id, function (cid) { return B.call('job_result', cid); }, timeoutMs || 30000, 500);
      }
      return res;
    });
  }

  var musicInFlight = false;
  var lastTrackKey = null;
  var cachedLyricsHtml = '';

  /* Waveform bars animate ONLY while music is actually playing: the
     .playing class on the island gates the .wave animation in CSS.
     One-shot SMTC read (no timers run while collapsed, so the last
     known state persists until the next expand refreshes it). */
  function refreshMusicState() {
    fetchIslandJob('island_music', []).then(function (r) {
      r = r || {};
      isl.classList.toggle('playing', !!r.available && /play/i.test(String(r.status || '')));
    }).catch(function () { isl.classList.remove('playing'); });
  }

  function renderMusic() {
    /* The 1 s panel timer calls this every second: never overlap two
       SMTC reads - a tick while one is in flight is skipped, and
       lyrics are re-fetched only when the track actually changes
       (the panel re-render re-injects the cached lyrics HTML). */
    if (musicInFlight) { return; }
    musicInFlight = true;
    fetchIslandJob('island_music', []).then(function (r) {
      r = r || {};
      if (!r.available) {
        isl.classList.remove('playing');
        panelBody.innerHTML = '<h3>الموسيقى</h3><p class="p-note">مفيش حاجة شغالة دلوقتي، أو الميزة دي مش متاحة على الجهاز ده.</p>';
        lastTrackKey = null;
        cachedLyricsHtml = '';
        return;
      }
      isl.classList.toggle('playing', /play/i.test(String(r.status || '')));
      var pos = Math.round(r.position_sec || 0);
      var dur = Math.round(r.duration_sec || 0);
      var key = (r.artist || '') + '|' + (r.title || '');
      var pct = dur > 0 ? Math.min(100, Math.round(pos / dur * 100)) : 0;
      var html = '<h3>' + esc(r.title || 'بدون عنوان') + '</h3>'
        + '<p class="p-note">' + esc(r.artist || '') + (r.album ? ' — ' + esc(r.album) : '') + ' · ' + esc(r.status || '') + '</p>'
        + '<div class="p-prog"><i style="width:' + pct + '%"></i></div>'
        + '<div class="p-time"><span>' + fmtClock(pos) + '</span><span>' + fmtClock(dur) + '</span></div>'
        + '<div id="lyricsBox"><p class="p-note">بيتم تحميل الكلمات…</p></div>';
      panelBody.innerHTML = html;
      var box = document.getElementById('lyricsBox');
      if (key !== lastTrackKey) {
        lastTrackKey = key;
        fetchIslandJob('island_lyrics', [r.artist || '', r.title || '', r.album || '', dur]).then(function (lr) {
          lr = lr || {};
          if (!lr.found || !(lr.synced && lr.synced.length)) {
            cachedLyricsHtml = '<p class="p-note">' + (lr.plain ? esc(lr.plain).replace(/\n/g, '<br>') : 'مفيش كلمات متزامنة للأغنية دي.') + '</p>';
          } else {
            cachedLyricsHtml = lr.synced.map(function (ln, i) {
              return '<div class="p-lyric" data-t="' + ln.t + '" data-i="' + i + '">' + esc(ln.text) + '</div>';
            }).join('');
          }
          var fresh = document.getElementById('lyricsBox');
          if (fresh) { fresh.innerHTML = cachedLyricsHtml; }
          highlightLyric(pos);
        }).catch(function (err) {
          var fresh = document.getElementById('lyricsBox');
          if (fresh) { fresh.innerHTML = '<p class="p-note">الكلمات مش متاحة دلوقتي.</p>'; }
          fail('island_lyrics', err);
        });
      } else {
        if (box) { box.innerHTML = cachedLyricsHtml; }
        highlightLyric(pos);
      }
    }).catch(function (err) {
      isl.classList.remove('playing');
      panelBody.innerHTML = '<h3>الموسيقى</h3><p class="p-note">الميزة دي مش متاحة دلوقتي.</p>';
      fail('island_music', err);
    }).then(function () { musicInFlight = false; });
  }

  function highlightLyric(posSec) {
    var rows = panelBody.querySelectorAll('.p-lyric');
    var cur = null;
    rows.forEach(function (row) {
      var t = parseFloat(row.getAttribute('data-t') || '0');
      if (t <= posSec) { cur = row; }
      row.classList.remove('cur');
    });
    if (cur) {
      cur.classList.add('cur');
      cur.scrollIntoView({ block: 'nearest' });
    }
  }

  function renderTimer() {
    B.call('island_timer_state').then(function (r) {
      r = r || {};
      var big = r.mode === 'stopwatch' ? fmtClock(r.elapsed_sec) : fmtClock(r.remaining_sec);
      var status = r.mode === 'idle' ? 'جاهز' : (r.running ? (r.mode === 'stopwatch' ? 'ستوب ووتش شغال' : 'مؤقت شغال') : 'متوقف مؤقتًا');
      var html = '<h3>المؤقت وستوب ووتش</h3>'
        + '<div class="p-big">' + big + '</div>'
        + '<p class="p-center p-note">' + esc(status) + '</p>'
        + '<div class="p-row p-center" style="justify-content:center">'
        + (r.presets_min || [5, 10, 25]).map(function (m) {
            return '<button class="p-btn" data-min="' + m + '">' + m + ' د</button>';
          }).join('')
        + '</div>'
        + '<div class="p-row" style="justify-content:center;margin-top:10px">'
        + '<button class="p-btn" id="tStopwatch">ستوب ووتش</button>'
        + (r.running
            ? '<button class="p-btn gold" id="tPause">إيقاف مؤقت</button>'
            : '<button class="p-btn gold" id="tResume">استئناف</button>')
        + '<button class="p-btn" id="tLap">لفة</button>'
        + '<button class="p-btn" id="tReset">تصفير</button>'
        + '</div>';
      if (r.laps && r.laps.length) {
        html += '<h3>اللفات</h3>' + r.laps.map(function (lap, i) {
          return '<div class="p-item"><span>لفة ' + (i + 1) + '</span><span class="grow"></span><b>' + fmtClock(lap) + '</b></div>';
        }).join('');
      }
      panelBody.innerHTML = html;
      panelBody.querySelectorAll('[data-min]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_timer_start', parseInt(btn.getAttribute('data-min'), 10))
            .then(function () { renderTimer(); })
            .catch(function (err) { fail('island_timer_start', err); });
        });
      });
      document.getElementById('tStopwatch').addEventListener('click', function () {
        B.call('island_stopwatch_start').then(function () { renderTimer(); })
          .catch(function (err) { fail('island_stopwatch_start', err); });
      });
      var pauseBtn = document.getElementById('tPause');
      if (pauseBtn) {
        pauseBtn.addEventListener('click', function () {
          B.call('island_timer_pause').then(function () { renderTimer(); })
            .catch(function (err) { fail('island_timer_pause', err); });
        });
      }
      var resumeBtn = document.getElementById('tResume');
      if (resumeBtn) {
        resumeBtn.addEventListener('click', function () {
          B.call('island_timer_resume').then(function () { renderTimer(); })
            .catch(function (err) { fail('island_timer_resume', err); });
        });
      }
      document.getElementById('tLap').addEventListener('click', function () {
        B.call('island_timer_lap').then(function () { renderTimer(); })
          .catch(function (err) { fail('island_timer_lap', err); });
      });
      document.getElementById('tReset').addEventListener('click', function () {
        B.call('island_timer_reset').then(function () { renderTimer(); })
          .catch(function (err) { fail('island_timer_reset', err); });
      });
      if (r.finished) {
        window.showIslandToast('المؤقت', 'خلص الوقت.', 6000);
      }
    }).catch(function (err) {
      panelBody.innerHTML = '<h3>المؤقت</h3><p class="p-note">الميزة دي مش متاحة دلوقتي.</p>';
      fail('island_timer_state', err);
    });
  }

  function renderTasks() {
    panelBody.innerHTML = '<h3>المهام والتذكيرات</h3><p class="p-note">بيتم التحميل…</p>';
    B.call('get_tasks').then(function (r) {
      r = r || {};
      var tasks = r.tasks || (Array.isArray(r) ? r : []);
      var html = '<h3>المهام والتذكيرات</h3>'
        + '<div class="p-row"><input class="p-input" id="taskText" placeholder="مهمة جديدة…" autocomplete="off" virtualkeyboardpolicy="manual">'
        + '<input class="p-input" id="taskWhen" placeholder="تذكير: 2026-11-23 14:00" style="flex:.7" autocomplete="off" virtualkeyboardpolicy="manual">'
        + '<button class="p-btn gold" id="taskAdd">إضافة</button></div>'
        + '<p class="p-note">التذكير اختياري — اكتب التاريخ والوقت بالشكل ده: 2026-11-23 14:00.</p>';
      if (!tasks.length) {
        html += '<p class="p-note">مفيش مهام لسه.</p>';
      } else {
        html += tasks.map(function (t) {
          var when = t.remind_at ? ' · تذكير ' + esc(t.remind_at) : (t.due ? ' · استحقاق ' + esc(t.due) : '');
          return '<div class="p-item"><button class="p-btn" data-toggle="' + esc(t.id) + '">' + (t.done ? 'تم' : 'عمل') + '</button>'
            + '<span class="grow' + (t.done ? ' done-x' : '') + '">' + esc(t.text)
            + '<span class="sub">' + when + '</span></span></div>';
        }).join('');
      }
      panelBody.innerHTML = html;
      document.getElementById('taskAdd').addEventListener('click', function () {
        var text = document.getElementById('taskText').value.trim();
        var when = document.getElementById('taskWhen').value.trim();
        if (!text) { return; }
        B.call('island_task_add', text, null, when || null).then(function () { renderTasks(); })
          .catch(function (err) { fail('island_task_add', err); });
      });
      panelBody.querySelectorAll('[data-toggle]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('toggle_task', btn.getAttribute('data-toggle')).then(function () { renderTasks(); })
            .catch(function (err) { fail('island_task_toggle', err); });
        });
      });
    }).catch(function (err) {
      panelBody.innerHTML = '<h3>المهام</h3><p class="p-note">الميزة دي مش متاحة دلوقتي.</p>';
      fail('island_tasks', err);
    });
  }

  function renderClipboard() {
    panelBody.innerHTML = '<h3>الحافظة</h3><p class="p-note">بيتم التحميل…</p>';
    B.call('island_clipboard_list').then(function (r) {
      r = r || {};
      if (!r.available) {
        panelBody.innerHTML = '<h3>الحافظة</h3><p class="p-note">سجل الحافظة متاح على ويندوز بس.</p>';
        return;
      }
      var entries = r.entries || [];
      var html = '<h3>الحافظة</h3>'
        + '<div class="p-row"><button class="p-btn" id="clipClear">مسح الكل (ما عدا المثبت)</button></div>'
        + '<p class="p-note">دوس على عنصر عشان يرجع للحافظة تاني.</p>';
      if (!entries.length) {
        html += '<p class="p-note">لسه مفيش حاجة متنسخة.</p>';
      } else {
        html += entries.map(function (e) {
          return '<div class="p-item"><button class="p-btn" data-copy="' + esc(e.id) + '">نسخ</button>'
            + '<span class="grow">' + esc(e.text || '') + '<span class="sub">' + esc(e.kind || '') + ' · ' + esc(e.at || '') + '</span></span>'
            + '<button class="p-btn" data-pin="' + esc(e.id) + '" data-pinned="' + (e.pinned ? '0' : '1') + '">' + (e.pinned ? 'إلغاء التثبيت' : 'تثبيت') + '</button>'
            + '<button class="p-btn" data-del="' + esc(e.id) + '">حذف</button></div>';
        }).join('');
      }
      panelBody.innerHTML = html;
      document.getElementById('clipClear').addEventListener('click', function () {
        B.call('island_clipboard_clear').then(function () { renderClipboard(); })
          .catch(function (err) { fail('island_clipboard_clear', err); });
      });
      panelBody.querySelectorAll('[data-copy]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_clipboard_copy', btn.getAttribute('data-copy'))
            .catch(function (err) { fail('island_clipboard_copy', err); });
        });
      });
      panelBody.querySelectorAll('[data-pin]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_clipboard_pin', btn.getAttribute('data-pin'), btn.getAttribute('data-pinned') === '1')
            .then(function () { renderClipboard(); })
            .catch(function (err) { fail('island_clipboard_pin', err); });
        });
      });
      panelBody.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_clipboard_delete', btn.getAttribute('data-del')).then(function () { renderClipboard(); })
            .catch(function (err) { fail('island_clipboard_delete', err); });
        });
      });
    }).catch(function (err) {
      panelBody.innerHTML = '<h3>الحافظة</h3><p class="p-note">الميزة دي مش متاحة دلوقتي.</p>';
      fail('island_clipboard', err);
    });
  }

  function renderShelf() {
    panelBody.innerHTML = '<h3>رف الملفات</h3><p class="p-note">بيتم التحميل…</p>';
    B.call('island_shelf_list').then(function (r) {
      r = r || {};
      var files = r.files || [];
      var html = '<h3>رف الملفات</h3>'
        + '<div class="p-row"><button class="p-btn gold" id="shelfAdd">إضافة ملف…</button></div>'
        + '<p class="p-note">السحب والإفلات مش متاح في الجزيرة — الإضافة من زر اختيار ملف، والدوس على ملف بيفتحه.</p>';
      if (!files.length) {
        html += '<p class="p-note">الرف فاضي لسه.</p>';
      } else {
        html += files.map(function (f) {
          return '<div class="p-item"><button class="p-btn" data-open="' + esc(f.id) + '">فتح</button>'
            + '<span class="grow">' + esc(f.name) + '<span class="sub">' + esc(f.path) + '</span></span>'
            + '<button class="p-btn" data-remove="' + esc(f.id) + '">إزالة</button></div>';
        }).join('');
      }
      panelBody.innerHTML = html;
      document.getElementById('shelfAdd').addEventListener('click', function () {
        B.call('island_shelf_add').then(function () { renderShelf(); })
          .catch(function (err) { fail('island_shelf_add', err); });
      });
      panelBody.querySelectorAll('[data-open]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_shelf_open', btn.getAttribute('data-open'))
            .catch(function (err) { fail('island_shelf_open', err); });
        });
      });
      panelBody.querySelectorAll('[data-remove]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_shelf_remove', btn.getAttribute('data-remove')).then(function () { renderShelf(); })
            .catch(function (err) { fail('island_shelf_remove', err); });
        });
      });
    }).catch(function (err) {
      panelBody.innerHTML = '<h3>رف الملفات</h3><p class="p-note">الميزة دي مش متاحة دلوقتي.</p>';
      fail('island_shelf', err);
    });
  }

  function renderWater() {
    B.call('island_water_state').then(function (r) {
      r = r || {};
      var pct = r.goal_ml ? Math.min(100, Math.round((r.drank_ml || 0) / r.goal_ml * 100)) : 0;
      var html = '<h3>تذكير المياه</h3>'
        + '<div class="p-big">' + (r.drank_ml || 0) + ' <span style="font-size:18px">/ ' + (r.goal_ml || 2000) + ' مل</span></div>'
        + '<div class="p-prog"><i style="width:' + pct + '%"></i></div>'
        + '<p class="p-center p-note">المتبقي: ' + (r.remaining_ml || 0) + ' مل' + (r.last_drink_at ? ' · آخر مرة: ' + esc(r.last_drink_at) : '') + '</p>'
        + '<div class="p-row" style="justify-content:center">'
        + '<button class="p-btn" data-ml="250">+250 مل</button>'
        + '<button class="p-btn" data-ml="500">+500 مل</button>'
        + '<button class="p-btn" data-ml="330">+330 مل</button>'
        + '</div>'
        + '<div class="p-row" style="justify-content:center;margin-top:10px">'
        + '<button class="p-btn" id="waterToggle">' + (r.enabled ? 'إيقاف التذكير' : 'تشغيل التذكير') + '</button>'
        + '<span class="p-note">كل ' + (r.interval_min || 60) + ' دقيقة</span>'
        + '</div>'
        + '<div class="p-row" style="justify-content:center;margin-top:10px">'
        + '<span class="p-note">الهدف اليومي:</span>'
        + '<button class="p-btn" data-goal="1500">1500 مل</button>'
        + '<button class="p-btn" data-goal="2000">2000 مل</button>'
        + '<button class="p-btn" data-goal="3000">3000 مل</button>'
        + '</div>';
      panelBody.innerHTML = html;
      panelBody.querySelectorAll('[data-ml]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_water_add', parseInt(btn.getAttribute('data-ml'), 10))
            .then(function () { renderWater(); })
            .catch(function (err) { fail('island_water_add', err); });
        });
      });
      panelBody.querySelectorAll('[data-goal]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          B.call('island_water_goal', parseInt(btn.getAttribute('data-goal'), 10))
            .then(function () { renderWater(); })
            .catch(function (err) { fail('island_water_goal', err); });
        });
      });
      document.getElementById('waterToggle').addEventListener('click', function () {
        B.call('island_water_reminder', !r.enabled, r.interval_min || 60)
          .then(function () { renderWater(); })
          .catch(function (err) { fail('island_water_reminder', err); });
      });
    }).catch(function (err) {
      panelBody.innerHTML = '<h3>المياه</h3><p class="p-note">الميزة دي مش متاحة دلوقتي.</p>';
      fail('island_water', err);
    });
  }

  function renderPrayer() {
    panelBody.innerHTML = '<h3>مواقيت الصلاة — القاهرة</h3><p class="p-note">بيتم التحميل…</p>';
    B.call('island_prayer', prayerMethod).then(function (r) {
      r = r || {};
      if (!r.ok) {
        panelBody.innerHTML = '<h3>مواقيت الصلاة</h3><p class="p-note">المواقيت مش متاحة دلوقتي.</p>';
        return;
      }
      var names = { fajr: 'الفجر', sunrise: 'الشروق', dhuhr: 'الظهر', asr: 'العصر', maghrib: 'المغرب', isha: 'العشاء' };
      var order = ['fajr', 'sunrise', 'dhuhr', 'asr', 'maghrib', 'isha'];
      var now = new Date();
      var nowMin = now.getHours() * 60 + now.getMinutes();
      var nextKey = null;
      order.forEach(function (k) {
        var parts = (r.times[k] || '00:00').split(':');
        var mins = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        if (nextKey === null && mins > nowMin) { nextKey = k; }
      });
      var html = '<h3>مواقيت الصلاة — القاهرة</h3>'
        + '<div class="p-row"><button class="p-btn' + (prayerMethod === 'egypt' ? ' gold' : '') + '" id="pmEgypt">مصر</button>'
        + '<button class="p-btn' + (prayerMethod === 'makkah' ? ' gold' : '') + '" id="pmMakkah">مكة</button>'
        + '<span class="p-note">' + esc(r.date || '') + '</span></div>'
        + order.map(function (k) {
            return '<div class="p-item"><span class="grow">' + names[k] + (k === nextKey ? ' <b style="color:var(--gold-2)">· التالية</b>' : '') + '</span><b>' + esc(r.times[k]) + '</b></div>';
          }).join('')
        + '<p class="p-note">حساب على الجهاز (طريقة ' + (prayerMethod === 'egypt' ? 'الهيئة المصرية' : 'أم القرى') + ') — بدون إنترنت.</p>';
      panelBody.innerHTML = html;
      document.getElementById('pmEgypt').addEventListener('click', function () {
        prayerMethod = 'egypt'; renderPrayer();
      });
      document.getElementById('pmMakkah').addEventListener('click', function () {
        prayerMethod = 'makkah'; renderPrayer();
      });
    }).catch(function (err) {
      panelBody.innerHTML = '<h3>مواقيت الصلاة</h3><p class="p-note">المواقيت مش متاحة دلوقتي.</p>';
      fail('island_prayer', err);
    });
  }

  var notifInFlight = false;

  function renderNotifs() {
    if (notifInFlight) { return; }
    notifInFlight = true;
    panelBody.innerHTML = '<h3>إشعارات ويندوز</h3><p class="p-note">بيتم التحميل…</p>';
    /* v1.6.4 perf (a): WinRT read runs off the bridge - poll
       job_result instead of awaiting a direct result. */
    fetchIslandJob('island_notifications', []).then(function (r) {
      r = r || {};
      if (!r.available) {
        panelBody.innerHTML = '<h3>إشعارات ويندوز</h3><p class="p-note">إشعارات ويندوز متاحة على ويندوز بس، ولازم إذن الإشعارات يكون ممنوح.</p>';
        return;
      }
      var items = r.notifications || [];
      var html = '<h3>إشعارات ويندوز</h3>'
        + '<div class="p-row"><button class="p-btn" id="notifRefresh">تحديث</button></div>';
      if (!items.length) {
        html += '<p class="p-note">مفيش إشعارات حالية.</p>';
      } else {
        html += items.map(function (n) {
          return '<div class="p-item"><span class="grow"><b>' + esc(n.title || n.app || '') + '</b><span class="sub">' + esc(n.app || '') + ' — ' + esc(n.body || '') + '</span></span></div>';
        }).join('');
      }
      panelBody.innerHTML = html;
      document.getElementById('notifRefresh').addEventListener('click', function () { renderNotifs(); });
    }).catch(function (err) {
      panelBody.innerHTML = '<h3>إشعارات ويندوز</h3><p class="p-note">الميزة دي مش متاحة دلوقتي.</p>';
      fail('island_notifications', err);
    }).then(function () { notifInFlight = false; });
  }

  /* --- reminder checks (v1.6.4 perf (c)): due tasks + water, once
     a minute, ONLY while the island is expanded. The timer itself
     is started on expand and cleared on collapse
     (startExpandedTimers / stopExpandedTimers) - collapsed, this
     function never runs at all. In-flight guarded. --- */
  function checkReminders() {
    if (reminderInFlight) { return; }
    reminderInFlight = true;
    B.call('island_tasks_due').then(function (r) {
      (r.tasks || []).forEach(function (t) {
        window.showIslandToast('تذكير', t.text || '', 8000);
        B.call('island_task_set_due', t.id, t.due || null, null).catch(function () {});
      });
    }).catch(function () {});
    B.call('island_water_state').then(function (r) {
      if (!r || !r.enabled || !r.last_drink_at) { return; }
      var parts = String(r.last_drink_at).split(':');
      var lastMin = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
      var now = new Date();
      var nowMin = now.getHours() * 60 + now.getMinutes();
      if (nowMin - lastMin >= (r.interval_min || 60) && Date.now() - lastWaterNudge > (r.interval_min || 60) * 60000) {
        lastWaterNudge = Date.now();
        window.showIslandToast('مياه', 'وقت تشرب مياه — بقالك أكتر من ' + (r.interval_min || 60) + ' دقيقة.', 6000);
      }
    }).catch(function () {}).then(function () { reminderInFlight = false; });
  }
})();
</script>
</body>
</html>
