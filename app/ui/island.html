<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>LONA Island</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; background-color: transparent; overflow: hidden; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #EDF2F7; }
  /* v1.6.0 THEMES (CSS vars, morph ~450ms) */
  :root, [data-theme="night-glass"] {
    --m-bg:#0A0E14; --m-chrome:#0D131C; --m-side:#0D141F; --m-card:#121A26; --m-listbg:#0D141F;
    --m-bubble:#16202F; --m-pill:rgba(232,201,122,.13); --m-track:#1D2939; --m-line:rgba(140,170,200,.16);
    --m-text:#EDF2F7; --m-muted:#8FA5B8; --m-accent:#E8C97A; --m-accent2:#67E8F9; --m-on-accent:#131A08;
    --m-glass:rgba(16,24,36,.72);
  }
  [data-theme="calm-space"] {
    --m-bg:#F4F6F3; --m-chrome:#E9EDE8; --m-side:#EEF1EC; --m-card:#FFFFFF; --m-listbg:#FFFFFF;
    --m-bubble:#E7EFE9; --m-pill:rgba(46,125,87,.12); --m-track:#DDE5DC; --m-line:#D8DFD6;
    --m-text:#1E2B23; --m-muted:#64766A; --m-accent:#2E7D57; --m-accent2:#D99A3D; --m-on-accent:#FFFFFF;
    --m-glass:rgba(255,255,255,.75);
  }
  [data-theme="dashboard"] {
    --m-bg:#101014; --m-chrome:#141419; --m-side:#141419; --m-card:#1A1A21; --m-listbg:#141419;
    --m-bubble:#1F1F28; --m-pill:rgba(255,176,102,.13); --m-track:#26262F; --m-line:rgba(200,200,220,.13);
    --m-text:#F2F0EB; --m-muted:#A3A0A8; --m-accent:#FFB066; --m-accent2:#8FD0C5; --m-on-accent:#241203;
    --m-glass:rgba(22,22,28,.72);
  }
  [data-theme="old"] {
    --m-bg:#0a0e14; --m-chrome:#10151f; --m-side:#0d121c; --m-card:#121826; --m-listbg:#0d121c;
    --m-bubble:#16202f; --m-pill:rgba(232,201,122,.16); --m-track:#1d2939; --m-line:rgba(255,255,255,.09);
    --m-text:#f2f4f8; --m-muted:#9aa3b2; --m-accent:#e8c97a; --m-accent2:#67e8f9; --m-on-accent:#231a05;
    --m-glass:rgba(13,18,28,.72);
  }
  body, .island, .island-expanded { transition: background-color .45s ease, color .45s ease, border-color .45s ease; }
  /* v1.6.2 (F4): NO clock on the collapsed pill at all — the time
     shows only inside the expanded island (.exp-clock). */
  .exp-clock { font-size: 13px; font-weight: 700; color: var(--m-text);
    text-align: end; letter-spacing: .5px; }
  /* Collapsed island: SMALL compact gold glass pill, ~56-64px tall,
     like the TOP of the reference image. Robot head in a bubble on the
     left, overlapping the pill edge. */
  .island {
    position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 380px; height: 60px;
    background: linear-gradient(180deg, rgba(24,32,46,.92), rgba(13,18,28,.92));
    border: 1px solid rgba(232,201,122,.55);
    border-radius: 999px; display: flex; align-items: center; gap: 8px;
    padding: 6px 10px 6px 58px; cursor: pointer;
    box-shadow: 0 8px 26px rgba(0,0,0,.5), 0 0 22px rgba(232,201,122,.18), inset 0 1px 0 rgba(255,255,255,.12);
    transition: border-radius .4s cubic-bezier(.22,1,.36,1), height .45s ease, width .45s ease;
  }
  .island .robot-bubble {
    position: absolute; inset-inline-start: 0; top: 50%; transform: translateY(-50%);
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 35% 30%, #2a3648, #0d121c 70%);
    border: 1px solid rgba(232,201,122,.6);
    box-shadow: 0 0 18px rgba(255,207,94,.35);
    display: flex; align-items: center; justify-content: center; overflow: visible;
  }
  .island .robot-bubble svg { width: 42px; height: 42px; }
  .island .texts { flex: 1; min-width: 0; color: #f2f4f8; }
  .island .agent-line { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; white-space: nowrap; }
  .island .agent-line .green-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ECF8E; box-shadow: 0 0 8px #3ECF8E; animation: pulse-dot 2.2s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
  .island .listen-line { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
  .island .wave { display: inline-flex; align-items: flex-end; gap: 2px; height: 16px; }
  .island .wave i { width: 3px; background: #E8C97A; border-radius: 2px; box-shadow: 0 0 6px rgba(232,201,122,.7); animation: wave 1s ease-in-out infinite; }
  .island .wave i:nth-child(1){height:6px} .island .wave i:nth-child(2){height:12px;animation-delay:.15s}
  .island .wave i:nth-child(3){height:16px;animation-delay:.3s} .island .wave i:nth-child(4){height:10px;animation-delay:.45s}
  .island .wave i:nth-child(5){height:7px;animation-delay:.6s}
  @keyframes wave { 0%,100% { transform: scaleY(.6); } 50% { transform: scaleY(1); } }
  .island .listen-text { font-size: 12.5px; color: #E8C97A; font-weight: 700; }
  .island .round-btn { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #EDF2F7;
    font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: transform .18s cubic-bezier(.22,1,.36,1), background .25s ease; }
  .island .round-btn:active { transform: scale(.9); }
  .island .round-btn.recording { color: #f87171; border-color: rgba(248,113,113,.6); animation: rec 1.1s ease-in-out infinite; }
  @keyframes rec { 0%,100% { box-shadow: 0 0 12px rgba(248,113,113,.25); } 50% { box-shadow: 0 0 28px rgba(248,113,113,.5); } }
  /* Robot moods: gold glowing eyes/mouth on the dark screen — NEVER white. */
  .robot .eye, .robot .mouth { fill: #FFCF5E; filter: drop-shadow(0 0 3px rgba(255,207,94,.9)); }
  .robot .blink { transform-origin: 50% 50%; animation: robot-blink 4.8s infinite; }
  @keyframes robot-blink { 0%, 93%, 100% { transform: scaleY(1); } 94.5% { transform: scaleY(.08); } 96% { transform: scaleY(1); } }
  .robot-wrap { cursor: pointer; }
  .robot-wrap.react { animation: reactJump .72s cubic-bezier(.22,1,.36,1); }
  @keyframes reactJump { 0% { transform: translateY(0) scale(1) rotate(0); } 30% { transform: translateY(-8px) scale(1.07) rotate(4deg); }
    55% { transform: translateY(0) scale(1.02) rotate(-4deg); } 75% { transform: translateY(-3px) scale(1.03) rotate(2deg); } 100% { transform: translateY(0) scale(1) rotate(0); } }
  .robot-wrap.wake { animation: wakePop .45s cubic-bezier(.22,1,.36,1); }
  @keyframes wakePop { 0% { transform: scale(.85); opacity: .6; } 60% { transform: scale(1.06); } 100% { transform: scale(1); opacity: 1; } }
  .robot-bubble-say { position: absolute; top: -8px; inset-inline-start: 56px; background: var(--m-accent); color: var(--m-on-accent);
    font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .25s ease; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .robot-bubble-say.show { opacity: 1; }
  .mood-nayem .robot { animation: robot-breathe 3.6s ease-in-out infinite; }
  @keyframes robot-breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .mood-sahee .robot { animation: robot-bob 2.6s ease-in-out infinite; }
  @keyframes robot-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .mood-fudooli .robot { animation: robot-tilt 4.4s ease-in-out infinite; }
  .mood-bifakkar .robot { animation: robot-tilt2 3.4s ease-in-out infinite; }
  @keyframes robot-tilt { 0%,100% { transform: rotate(0); } 50% { transform: rotate(5deg); } }
  @keyframes robot-tilt2 { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }
  .mood-alqan .robot { animation: robot-tremble .32s ease-in-out infinite; }
  @keyframes robot-tremble { 0%,100% { transform: translateX(0); } 50% { transform: translateX(1.5px); } }
  .mood-dayekh .robot { animation: robot-wobble .55s ease-in-out infinite; }
  @keyframes robot-wobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
  .mood-mabsoot .robot, .mood-mabsoot .robot-body { animation: botDance .62s ease-in-out infinite; }
  @keyframes botDance { 0%,100% { transform: translateY(0) rotate(0); } 30% { transform: translateY(-6px) rotate(5deg); }
    60% { transform: translateY(0) rotate(-5deg); } 80% { transform: translateY(-3px) rotate(3deg); } }
  .mood-bihtafel .robot, .mood-bihtafel .robot-body { animation: botParty .5s ease-in-out infinite; }
  @keyframes botParty { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.04); } }
  .mood-mutafaje .robot { animation: robot-pop .55s cubic-bezier(.22,1,.36,1); }
  @keyframes robot-pop { 0% { transform: scale(.9); } 60% { transform: scale(1.07); } 100% { transform: scale(1); } }
  .mood-saeed .robot { animation: robot-pulse 1s ease-in-out infinite; }
  @keyframes robot-pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .mood-taaban .robot { animation: robot-nod 2.8s ease-in-out infinite; }
  @keyframes robot-nod { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(2px) rotate(3deg); } }
  .mood-nayem .zzz { display: block; }
  .zzz { display: none; position: absolute; top: -6px; inset-inline-end: -4px; color: var(--m-accent2);
    font-size: 13px; font-weight: 700; animation: z-float 3.6s ease-in-out infinite; }
  @keyframes z-float { 0% { opacity: 0; transform: translateY(4px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
  /* Expanded island: big glass window like the BOTTOM of the reference image. */
  .island-expanded { display: none; position: fixed; top: 0; left: 50%; transform: translateX(-50%);
    width: 720px; height: 400px;
    background: linear-gradient(180deg, rgba(24,32,46,.94), rgba(13,18,28,.94));
    border: 1px solid rgba(232,201,122,.55); border-radius: 26px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), 0 0 30px rgba(232,201,122,.16), inset 0 1px 0 rgba(255,255,255,.12);
    padding: 16px; gap: 16px; }
  body.expanded .island-expanded { display: flex; animation: expand-in .45s cubic-bezier(.22,1,.36,1) both; }
  body.expanded .island { display: none; }
  @keyframes expand-in { from { opacity: 0; transform: translateX(-50%) scale(.96) translateY(-6px); } to { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); } }
  .exp-robot { flex: 0 0 190px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; }
  .exp-robot .platform { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); }
  .exp-robot .platform ellipse { fill: none; stroke: #FFCF5E; opacity: .7; }
  .exp-robot .platform ellipse:nth-child(1) { animation: ring-pulse .9s ease-in-out infinite; }
  .exp-robot .platform ellipse:nth-child(2) { animation: ring-pulse .9s .2s ease-in-out infinite; }
  .exp-robot .platform ellipse:nth-child(3) { animation: ring-pulse .9s .4s ease-in-out infinite; }
  @keyframes ring-pulse { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
  .exp-robot svg.robot-body { width: 140px; height: 172px; position: relative; z-index: 1; }
  .exp-side { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
    background: rgba(255,255,255,.08); color: #EDF2F7; font-size: 15px; cursor: pointer; }
  .exp-greet { display: flex; align-items: center; gap: 10px; }
  .exp-greet .avatar-dot { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .exp-greet .greet-bubble { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    border-radius: 18px; padding: 10px 14px; font-size: 14.5px; line-height: 1.5; }
  .exp-composer { display: flex; align-items: center; gap: 8px; margin-top: auto; }
  .exp-composer .plus-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2);
    background: rgba(255,255,255,.08); color: #EDF2F7; font-size: 20px; cursor: pointer; flex-shrink: 0;
    transition: transform .3s cubic-bezier(.22,1,.36,1); }
  .exp-composer .plus-btn.open { transform: rotate(45deg); }
  .exp-composer input { flex: 1; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16);
    border-radius: 999px; padding: 11px 16px; font-size: 14px; color: #EDF2F7; outline: none; font-family: inherit; }
  .exp-composer input:focus { border-color: rgba(103,232,249,.5); }
  .exp-composer .send-btn { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(160deg, #f0d48a, #d4af6a); color: #231a05; font-size: 16px; font-weight: 700; cursor: pointer; border: none; }
  .exp-attach { display: none; gap: 8px; flex-wrap: wrap; }
  .exp-attach.open { display: flex; }
  .exp-attach button { padding: 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.07); color: #EDF2F7; font-size: 12.5px; cursor: pointer; }
  .reply-line { font-size: 13px; line-height: 1.6; color: #dbe2ec; max-height: 52px; overflow: hidden; }
</style>
</head>
<body data-theme="night-glass">
<!-- Collapsed island -->
<div class="island" id="island">
  <div class="robot-bubble robot-wrap" id="island-robot" title="لونا">
    <span class="zzz">Z</span>
    <span id="island-robot-svg"></span>
    <span class="robot-bubble-say" id="island-say"></span>
  </div>
  <div class="texts">
    <div class="agent-line"><span class="green-dot"></span><span id="island-name">LONA</span><span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle;transform:rotate(90deg)"><use href="assets/lona-icons-sprite.svg#back"/></svg></span></div>
    <div class="listen-line"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span><span class="listen-text" id="listen-text">Listening...</span></div>
  </div>
</div>

<!-- Expanded island -->
<div class="island-expanded" id="island-expanded">
  <div class="exp-robot robot-wrap" id="exp-robot">
    <span class="zzz">Z</span>
    <span id="exp-robot-svg"></span>
    <svg class="platform" width="150" height="40" viewBox="0 0 150 40" aria-hidden="true">
      <ellipse cx="75" cy="20" rx="48" ry="10"></ellipse>
      <ellipse cx="75" cy="20" rx="35" ry="7"></ellipse>
      <ellipse cx="75" cy="20" rx="22" ry="4.5"></ellipse>
    </svg>
    <span class="robot-bubble-say" id="exp-say"></span>
  </div>
  <div class="exp-side">
    <div class="exp-clock" id="exp-clock">--:--</div>
    <div class="exp-greet">
      <div class="avatar-dot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle"><use href="assets/lona-icons-sprite.svg#avatar"/></svg></div>
      <div class="greet-bubble" id="exp-greet">أهلاً يا محمد! أقدر أساعدك في إيه النهاردة؟</div>
    </div>
    <div class="reply-line" id="exp-reply"></div>
    <div class="exp-composer">
      <button class="plus-btn" id="exp-plus" type="button" title="إضافة">+</button>
      <input id="exp-input" type="text" placeholder="Type a message..." virtualkeyboardpolicy="manual">
      <button class="send-btn" id="exp-send" type="button" title="إرسال"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:middle"><use href="assets/lona-icons-sprite.svg#send"/></svg></button>
    </div>
    <div class="exp-attach" id="exp-attach">
      <button type="button" data-kind="صور">صور</button>
      <button type="button" data-kind="ملفات">ملفات</button>
      <button type="button" data-kind="فيديو">فيديو</button>
      <button type="button" data-kind="مستندات">مستندات</button>
    </div>
  </div>
</div>

<script>
  document.documentElement.style.backgroundColor = "transparent";
  document.body.style.backgroundColor = "transparent";
  const $ = id => document.getElementById(id);
  const getApi = () => (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
  let _uaLogged = false, _readyLogged = false;
  function logEngine() { if (_uaLogged) return; const a = getApi(); if (!a || !a.log_js) return; _uaLogged = true; try { a.log_js("UA: " + navigator.userAgent); } catch (e) {} }
  function logReady() { if (_readyLogged) return; const a = getApi(); if (!a || !a.log_js) return; _readyLogged = true; try { a.log_js("READY island"); } catch (e) {} }
  logEngine(); logReady();
  window.addEventListener("pywebviewready", logEngine);
  window.addEventListener("pywebviewready", logReady);

  /* ROBOT SVG — white/off-white body #F8F4EC, stroke #D9C08A, dark face
     screen #101318, gold #E9B558 headphones, GOLD glowing eyes/mouth —
     NEVER white eyes/mouth. Head viewBox 0 0 120 84, body 140x172. */
  function robotHeadSVG() {
    return '<svg class="robot" width="42" height="42" viewBox="0 0 120 84" aria-label="LONA robot">'
      + '<g><path d="M22 34 Q14 10 44 8" fill="none" stroke="#E9B558" stroke-width="5" stroke-linecap="round"/>'
      + '<path d="M98 34 Q106 10 76 8" fill="none" stroke="#E9B558" stroke-width="5" stroke-linecap="round"/>'
      + '<circle cx="20" cy="40" r="10" fill="#F8F4EC" stroke="#D9C08A" stroke-width="2"/>'
      + '<circle cx="100" cy="40" r="10" fill="#F8F4EC" stroke="#D9C08A" stroke-width="2"/>'
      + '<ellipse cx="60" cy="46" rx="40" ry="34" fill="#F8F4EC" stroke="#D9C08A" stroke-width="2"/>'
      + '<ellipse cx="60" cy="46" rx="31" ry="25" fill="#101318"/>'
      + '<g class="blink"><path class="eye" d="M40 44 Q46 36 52 44 Q46 49 40 44Z"/><path class="eye" d="M68 44 Q74 36 80 44 Q74 49 68 44Z"/></g>'
      + '<path class="mouth" d="M52 58 Q60 64 68 58" fill="none" stroke="#FFCF5E" stroke-width="3.5" stroke-linecap="round"/></g></svg>';
  }
  function robotBodySVG() {
    return '<svg class="robot robot-body" width="140" height="172" viewBox="0 0 140 172" aria-label="LONA robot full body">'
      + '<g><path d="M30 42 Q22 12 58 10" fill="none" stroke="#E9B558" stroke-width="6" stroke-linecap="round"/>'
      + '<path d="M110 42 Q118 12 82 10" fill="none" stroke="#E9B558" stroke-width="6" stroke-linecap="round"/>'
      + '<circle cx="28" cy="48" r="12" fill="#F8F4EC" stroke="#D9C08A" stroke-width="2"/>'
      + '<circle cx="112" cy="48" r="12" fill="#F8F4EC" stroke="#D9C08A" stroke-width="2"/>'
      + '<ellipse cx="70" cy="52" rx="46" ry="38" fill="#F8F4EC" stroke="#D9C08A" stroke-width="2"/>'
      + '<ellipse cx="70" cy="52" rx="36" ry="28" fill="#101318"/>'
      + '<g class="blink"><path class="eye" d="M48 50 Q55 41 62 50 Q55 56 48 50Z"/><path class="eye" d="M78 50 Q85 41 92 50 Q85 56 78 50Z"/></g>'
      + '<path class="mouth" d="M60 66 Q70 73 80 66" fill="none" stroke="#FFCF5E" stroke-width="4" stroke-linecap="round"/>'
      + '<rect x="48" y="92" width="44" height="42" rx="16" fill="#F8F4EC" stroke="#D9C08A" stroke-width="2"/>'
      + '<circle cx="70" cy="110" r="6" fill="#E9B558"/><circle cx="70" cy="110" r="9" fill="none" stroke="#FFCF5E" stroke-width="1.5" opacity=".7"/>'
      + '<g class="arm-l"><path d="M48 100 Q30 112 34 128" fill="none" stroke="#F8F4EC" stroke-width="9" stroke-linecap="round"/><circle cx="34" cy="130" r="6" fill="#F8F4EC" stroke="#D9C08A" stroke-width="1.5"/></g>'
      + '<g class="arm-r"><path d="M92 100 Q110 112 106 128" fill="none" stroke="#F8F4EC" stroke-width="9" stroke-linecap="round"/><circle cx="106" cy="130" r="6" fill="#F8F4EC" stroke="#D9C08A" stroke-width="1.5"/></g>'
      + '<ellipse cx="70" cy="160" rx="34" ry="7" fill="none" stroke="#FFCF5E" stroke-width="1.5" opacity=".6"/></g></svg>';
  }
  $("island-robot-svg").innerHTML = robotHeadSVG();
  $("exp-robot-svg").innerHTML = robotBodySVG();

  /* 13 MOODS — automatic, NO mood buttons. setMood() syncs island +
     expanded robot. Mood class names: mood-nayem, mood-sahee,
     mood-fudooli, mood-bifakkar, mood-alqan, mood-dayekh, mood-murakkaz,
     mood-fakhoor, mood-mabsoot, mood-bihtafel, mood-mutafaje, mood-saeed, mood-taaban. */
  const MOODS = {
    "نايم": "mood-nayem", "صاحي": "mood-sahee", "فضولي": "mood-fudooli", "بيفكر": "mood-bifakkar",
    "قلقان": "mood-alqan", "دايخ": "mood-dayekh", "مركّز": "mood-murakkaz", "فخور": "mood-fakhoor",
    "مبسوط وبيرقص": "mood-mabsoot", "بيحتفل": "mood-bihtafel", "متفاجئ": "mood-mutafaje",
    "سعيد بيك": "mood-saeed", "تعبان": "mood-taaban"
  };
  const MOOD_CLASSES = Object.values(MOODS);
  let currentMood = "صاحي";
  function setMood(name) {
    if (!MOODS[name]) return;
    currentMood = name;
    document.body.classList.remove(...MOOD_CLASSES);
    document.body.classList.add(MOODS[name]);
    const exp = $("island-expanded");
    if (exp) { exp.classList.remove(...MOOD_CLASSES); exp.classList.add(MOODS[name]); }
  }
  window.setMood = setMood;
  /* STATE-DRIVEN mood: poll the Python bridge get_mood() every 5s.
     A timer cycle is a demo only — it runs ONLY as a fallback when
     the bridge is absent. */
  let moodTimer = null;
  let moodPollTimer = null, moodPollInFlight = false, moodPollingStarted = false;
  function startMoodPolling() {
    // v1.6.2 (B13): get_mood is polled EXACTLY once per 5s — the old
    // code called startMoodPolling() twice (load + pywebviewready)
    // and never stored the first interval id. The started guard +
    // stored id make a second call a no-op; the pywebviewready
    // handler below only restarts when the bridge was absent at load.
    if (moodPollingStarted) return;
    moodPollingStarted = true;
    const api = getApi();
    if (api && api.get_mood) {
      moodPollTimer = setInterval(async () => {
        if (moodPollInFlight) return; // v1.6.2 (B12): never stack polls
        moodPollInFlight = true;
        try { const r = await api.get_mood(); if (r && r.mood) setMood(r.mood); } catch (e) {}
        finally { moodPollInFlight = false; }
      }, 5000);
    } else {
      const names = Object.keys(MOODS);
      let i = names.indexOf(currentMood);
      moodTimer = setInterval(() => { i = (i + 1) % names.length; setMood(names[i]); }, 8000);
    }
  }
  startMoodPolling();
  /* CUSTOMIZABLE AI NAME: the pill label shows the chosen name
     (default LONA), read live from the bridge ai_name setting. */
  async function loadAiName() {
    let name = "LONA";
    const api = getApi();
    if (api && api.get_status) {
      try { const st = await api.get_status(); if (st && st.settings && st.settings.ai_name) name = st.settings.ai_name; } catch (e) {}
    } else if (api && api.get_ai_name) {
      try { const r = await api.get_ai_name(); if (r && r.name) name = r.name; } catch (e) {}
    }
    const el = $("island-name");
    if (el) el.textContent = name;
  }
  let aiNameTimer = null, aiNameInFlight = false;
  async function loadAiNameGuarded() {
    if (aiNameInFlight) return; // v1.6.2 (B12): never stack name reads
    aiNameInFlight = true;
    try { await loadAiName(); } finally { aiNameInFlight = false; }
  }
  loadAiNameGuarded();
  aiNameTimer = setInterval(loadAiNameGuarded, 5000);
  window.addEventListener("pywebviewready", loadAiNameGuarded);
  window.addEventListener("pywebviewready", () => {
    // The bridge was absent at load, so only the demo mood cycle runs:
    // stop it and start the real get_mood() poll instead.
    if (moodTimer) { clearInterval(moodTimer); moodTimer = null; moodPollingStarted = false; }
    startMoodPolling();
  });

  /* v1.6.2 (F4): the clock lives ONLY inside the expanded island
     (#exp-clock, HH:MM, ticks every 15s) — never on the collapsed pill. */
  function tickClock() {
    const d = new Date();
    const el = $("exp-clock");
    if (el) el.textContent = String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  tickClock(); setInterval(tickClock, 15000);

  /* Window sizing (Win32 region follows via island_resize). */
  const IDLE_W = 190, IDLE_H = 52, FULL_W = 380, FULL_H = 60, EXPANDED_W = 720, EXPANDED_H = 400;
  const ANIM_MS = 450;
  let curW = IDLE_W, curH = IDLE_H, sizeRAF = null, lastResizeSent = 0, idleTimer = null;
  function animateSize(toW, toH) {
    const fromW = curW, fromH = curH;
    if (fromW === toW && fromH === toH) return;
    const t0 = performance.now();
    if (sizeRAF) cancelAnimationFrame(sizeRAF);
    function frame(now) {
      const p = Math.min(1, (now - t0) / ANIM_MS);
      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const w = Math.round(fromW + (toW - fromW) * e);
      const h = Math.round(fromH + (toH - fromH) * e);
      const api = getApi();
      if (api && api.island_resize && now - lastResizeSent > 33) { lastResizeSent = now; try { api.island_resize(w, h); } catch (e) {} }
      curW = w; curH = h;
      if (p < 1) sizeRAF = requestAnimationFrame(frame);
      else { sizeRAF = null; curW = toW; curH = toH; }
    }
    sizeRAF = requestAnimationFrame(frame);
  }
  function armIdleTimer() { clearTimeout(idleTimer); idleTimer = setTimeout(goIdle, 7000); }
  function goActive() {
    document.body.classList.remove("expanded");
    animateSize(FULL_W, FULL_H); armIdleTimer();
  }
  function goIdle() {
    document.body.classList.remove("expanded");
    $("exp-reply").textContent = "";
    animateSize(IDLE_W, IDLE_H);
  }
  function expandIsland() {
    /* Clicking the island expands it: the full-body robot appears on
       the side, with the greeting + composer beside it. The time
       shows only here (inside the expanded island, never on the pill). */
    document.body.classList.add("expanded");
    clearTimeout(idleTimer);
    animateSize(EXPANDED_W, EXPANDED_H);
  }
  function collapseIsland() { document.body.classList.remove("expanded"); goActive(); }
  function expandWithReply(text) {
    if (text) $("exp-reply").textContent = text;
    expandIsland();
  }
  function showIslandText(text) { $("exp-greet").textContent = text; goActive(); }

  /* Robot interaction: tapping the robot does NOT open/close the
     island — it reacts (reactJump .72s + waving arm + gold bubble
     1.5s) and flips the mood نايم إلى صاحي, anything else إلى مبسوط وبيرقص. */
  const SAYINGS = ["أهلًا!", "أنا هنا!", "ازيك يا محمد!"];
  let sayIdx = 0, sayTimer = null;
  function robotReact(wrap, sayEl) {
    wrap.classList.remove("react"); void wrap.offsetWidth; wrap.classList.add("react");
    const say = sayEl || $("island-say");
    say.textContent = SAYINGS[sayIdx % SAYINGS.length]; sayIdx++;
    say.classList.add("show");
    clearTimeout(sayTimer); sayTimer = setTimeout(() => say.classList.remove("show"), 1500);
    const next = currentMood === "نايم" ? "صاحي" : "مبسوط وبيرقص";
    setMood(next);
    wrap.classList.add("wake"); setTimeout(() => wrap.classList.remove("wake"), 450);
  }
  $("island-robot").addEventListener("click", e => { e.stopPropagation(); robotReact($("island-robot"), $("island-say")); });
  $("exp-robot").addEventListener("click", e => { e.stopPropagation(); robotReact($("exp-robot"), $("exp-say")); });

  function logClick(msg) { try { const a = getApi(); if (a && a.log_js) a.log_js(msg); } catch (e) {} }
  $("island").addEventListener("pointerdown", () => logClick("Island pill pointerdown"));
  $("island").addEventListener("click", () => { logClick("Island pill clicked - expanding"); expandIsland(); });
  $("island-expanded").addEventListener("click", e => {
    // No window-control buttons on the island: tap the island itself
    // to close it. Taps on controls (buttons, inputs, panels,
    // composer) keep working and do NOT collapse it.
    if (e.target.closest("button, input, .exp-composer, .exp-greet")) return;
    collapseIsland();
  });
  $("exp-plus").addEventListener("click", () => {
    const m = $("exp-attach"); m.classList.toggle("open"); $("exp-plus").classList.toggle("open", m.classList.contains("open"));
  });
  document.querySelectorAll("#exp-attach button").forEach(b => b.addEventListener("click", () => {
    $("exp-greet").textContent = "اختار " + b.dataset.kind + " من جهازك — هبعتها للونا.";
    $("exp-attach").classList.remove("open"); $("exp-plus").classList.remove("open");
  }));
  /* v1.6.2 (A7): one shared pending poll — the cap timer is stored
     and cleared on success; at the 150s cap it resolves with a FAILURE
     message that is WRITTEN into exp-reply (never {reply: ""} leaving
     "بيفكّر..." forever). window.__islandCapMs is a test hook. */
  function waitForIslandChatResult(chatId) {
    const api = getApi();
    return new Promise((resolve) => {
      const timer = setInterval(async () => {
        try { const r = await api.chat_result(chatId); if (r && r.done) { clearInterval(timer); clearTimeout(capTimer); resolve(r); } } catch (err) {}
      }, 1200);
      const capMs = (typeof window !== "undefined" && window.__islandCapMs) || 150000;
      const capTimer = setTimeout(() => { clearInterval(timer); resolve({ reply: "الرد اتأخر أوي — المخ مش بيرد دلوقتي، جرّب تاني.", engine: "", timed_out: true }); }, capMs);
    });
  }
  async function sendIslandText() {
    const input = $("exp-input"); const text = input.value.trim();
    if (!text) return;
    input.value = "";
    const api = getApi();
    if (!api) { $("exp-reply").textContent = "مش قادر أوصل لمحرك البرنامج — اقفل البرنامج وافتحه تاني"; return; }
    $("exp-reply").textContent = "بيفكّر...";
    try {
      const res = await api.chat(text);
      if (res && res.pending) {
        const done = await waitForIslandChatResult(res.chat_id);
        $("exp-reply").textContent = (done && done.reply) || "حصلت مشكلة، جرّب تاني.";
      } else if (res && res.reply) $("exp-reply").textContent = res.reply;
    } catch (e) { $("exp-reply").textContent = "حصلت مشكلة، جرّب تاني."; }
  }
  $("exp-send").addEventListener("click", sendIslandText);
  $("exp-input").addEventListener("keydown", e => { if (e.key === "Enter") sendIslandText(); });
  // Start collapsed.
  animateSize(IDLE_W, IDLE_H);
</script>
</body>
</html>
