<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Memo AI Island</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* v1.3.0 CHROMA-KEY (replaces the v1.2 "transparent" attempt - see
     main.py): the page background is pure magenta #FF00FF. Windows
     itself removes that exact color from the window (Win32 layered
     window, LWA_COLORKEY), so only the pill is visible - no rectangle.
     Magenta appears NOWHERE in the UI, so nothing else gets keyed out. */
  html, body { background: #FF00FF; background-color: #FF00FF; overflow: hidden; }
  body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; }
  /* Small pill, like a phone Dynamic Island - NOT a wide rectangle.
     v1.2: backdrop-filter REMOVED - on some WebView2 builds it forces the
     whole window layer to composite opaquely (white rectangle). A solid
     near-opaque navy reads the same and cannot break transparency.
     v1.2.3: the pill is 100% of the window - the WINDOW animates its
     size (idle compact <-> full <-> expanded reply) and the pill
     follows smoothly. The pill's dark navy color is unchanged. */
  .island {
    width: 100%; height: 100%;
    background: rgba(13, 18, 28, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; cursor: pointer;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
    transition: border-radius 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .island.expanded { border-radius: 22px; align-items: flex-start; padding-top: 10px; }
  .cat { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15); animation: breathe 4.5s ease-in-out infinite; }
  .cat img { width: 100%; height: 100%; object-fit: cover; }
  @keyframes breathe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  /* v1.2.3: texts are hidden in the IDLE compact pill (cat + mic only)
     and fade in as the island grows to its ACTIVE size. */
  .texts { flex: 1; min-width: 0; color: #f2f4f8;
    opacity: 0; transition: opacity 0.35s ease; }
  .island.active .texts { opacity: 1; }
  .greet { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { font-size: 11px; color: #9aa3b2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply { display: none; font-size: 12.5px; line-height: 1.6; color: #dbe2ec; margin-top: 6px;
    max-height: 56px; overflow: hidden; }
  .island.expanded .reply { display: block; animation: fade-in 0.35s ease; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .mic {
    width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(103,232,249,0.4);
    background: radial-gradient(circle at 35% 30%, #1e293b, #0b0f16 70%);
    color: #67e8f9; font-size: 18px; cursor: pointer; flex-shrink: 0;
    box-shadow: 0 0 18px rgba(103,232,249,0.25);
    transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .mic:active { transform: scale(0.9); }
  .mic.recording { color: #f87171; border-color: rgba(248,113,113,0.6);
    animation: rec 1.1s ease-in-out infinite; }
  @keyframes rec { 0%, 100% { box-shadow: 0 0 12px rgba(248,113,113,0.25); }
    50% { box-shadow: 0 0 28px rgba(248,113,113,0.5); } }
</style>
</head>
<body>
  <div class="island" id="island">
    <div class="cat"><img src="assets/avatar-cat.png" alt="Memo"></div>
    <div class="texts">
      <div class="greet" id="greet">Memo AI</div>
      <div class="sub" id="sub">اضغط للفتح • 🎙️ للتحدث</div>
      <div class="reply" id="reply"></div>
    </div>
    <button class="mic" id="mic" title="تحدث">🎙️</button>
  </div>
<script>
  // v1.3.0 CHROMA-KEY: the page background is pure magenta #FF00FF and
  // Windows removes that exact color from the window (Win32 layered
  // window, LWA_COLORKEY - applied by main.py). The old "transparent"
  // approach is DEAD: pywebview on Windows only makes the WebView2
  // control transparent INSIDE itself - the WinForms window stays
  // opaque and transparent pixels render as a black rectangle.
  document.documentElement.style.backgroundColor = "#FF00FF";
  document.body.style.backgroundColor = "#FF00FF";

  // v1.2.2: report the browser engine to the diagnostics log, so we know
  // for sure whether the windows are drawn by WebView2 (UA has "Edg/")
  // or by the old MSHTML engine (UA has "MSIE"/"Trident/") — the latter
  // cannot do transparency and paints the dark rectangle.
  let _uaLogged = false;
  function logEngine() {
    if (_uaLogged) return;
    const a = (window.pywebview && window.pywebview.api) || null;
    if (!a || !a.log_js) return;
    _uaLogged = true;
    try { a.log_js("UA: " + navigator.userAgent); } catch (e) {}
  }
  logEngine();
  window.addEventListener("pywebviewready", logEngine);

  const $ = id => document.getElementById(id);

  // v1.2.3: idle/active island.
  // IDLE = compact pill (~190x52, cat + mic only, texts faded out).
  // ACTIVE = full pill (380x56, greeting + sub visible) or the expanded
  // reply size (380x120). Growth/shrink is a gradual ~0.45s ease: the
  // WINDOW animates in small steps (rAF -> api.island_resize, which also
  // re-centers it) and the pill div is 100% of the window, so it follows
  // smoothly; the texts fade in as it grows. After ~7s of inactivity
  // it shrinks back to idle compact.
  const IDLE_W = 190, IDLE_H = 52, FULL_W = 380, FULL_H = 56, EXPANDED_H = 120;
  const ANIM_MS = 450;
  let curW = IDLE_W, curH = IDLE_H, sizeRAF = null, lastResizeSent = 0;
  let idleTimer = null;

  function animateSize(toW, toH) {
    const fromW = curW, fromH = curH;
    if (fromW === toW && fromH === toH) return;
    const t0 = performance.now();
    if (sizeRAF) cancelAnimationFrame(sizeRAF);
    function frame(now) {
      const p = Math.min(1, (now - t0) / ANIM_MS);
      const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      const w = Math.round(fromW + (toW - fromW) * e);
      const h = Math.round(fromH + (toH - fromH) * e);
      if (window.pywebview && window.pywebview.api
          && window.pywebview.api.island_resize
          && now - lastResizeSent > 33) {   // ~30 fps is plenty
        lastResizeSent = now;
        window.pywebview.api.island_resize(w, h);
      }
      curW = w; curH = h;
      if (p < 1) sizeRAF = requestAnimationFrame(frame);
      else { sizeRAF = null; curW = toW; curH = toH; }
    }
    sizeRAF = requestAnimationFrame(frame);
  }
  function armIdleTimer() {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(goIdle, 7000);
  }
  function goActive() {
    $("island").classList.add("active");
    $("island").classList.remove("expanded");
    animateSize(FULL_W, FULL_H);
    armIdleTimer();
  }
  function goIdle() {
    const island = $("island");
    island.classList.remove("active");
    island.classList.remove("expanded");
    $("reply").textContent = "";
    animateSize(IDLE_W, IDLE_H);
  }
  function expandWithReply(text) {
    const island = $("island");
    if (text) $("reply").textContent = text;
    island.classList.add("active");
    island.classList.add("expanded");
    animateSize(FULL_W, EXPANDED_H);
    armIdleTimer();
  }

  // Called from Python (morning briefing / status updates).
  function showIslandText(text) {
    $("greet").textContent = text;
    goActive();
  }

  $("island").addEventListener("click", () => {
    if (window.pywebview) window.pywebview.api.open_main();
  });
  $("mic").addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!window.pywebview) return;
    const mic = $("mic");
    mic.classList.add("recording");
    $("sub").textContent = "🎙️ بسمعك... اتكلم دلوقتي";
    goActive();   // listening is an ACTIVE state: grow to the full pill
    try {
      const res = await window.pywebview.api.voice_chat();
      $("greet").textContent = res.heard ? "سمعتك: " + res.heard : "Memo AI";
      if (res && res.pending) {
        // v1.3.0: owner-mode tool chat runs in the background - the
        // Allow/Deny dialog appears in the main window (Python brings
        // it forward). Poll chat_result() here until the reply arrives.
        $("sub").textContent = "🤔 بفكّر وبنفّذ...";
        const done = await new Promise((resolve) => {
          const timer = setInterval(async () => {
            try {
              const r = await window.pywebview.api.chat_result(res.chat_id);
              if (r && r.done) { clearInterval(timer); resolve(r); }
            } catch (err) { /* keep polling */ }
          }, 1200);
          setTimeout(() => { clearInterval(timer); resolve({ reply: "" }); }, 150000);
        });
        if (done.reply) expandWithReply(done.reply);
        else goActive();
      } else if (res.reply) expandWithReply(res.reply);
      else goActive();
    } catch (err) {
      $("sub").textContent = "مقدرتش أسمعك — جرّب تاني";
      armIdleTimer();
    }
    mic.classList.remove("recording");
  });
</script>
</body>
</html>
